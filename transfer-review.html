    function closeMatchOkConfirm() {
      const layer = document.getElementById("match-ok-mask");
      if (layer) layer.remove();
    }

    function submitDialog() {
      const preview = previewMatchSubmit();
      if (!preview) return;
      closeMatchOkConfirm();
      const row = preview.row;
      const flow = preview.flow;
      const dialog = preview.dialog;
      const cover = preview.cover;
      const fxRes = preview.fxRes;
      const credit = preview.credit;
      const expect = matchExpect(row, dialog);
      row.flowId = dialog.selectedId;
      row.status = "已匹配";
      row.currency = matchCcy(row, dialog);
      if (expect != null) row.amount = expect;
      row.creditCurrency = flow.currency;
      row.creditAmount = flow.net;
      row.payPlatform = flow.platform;
      row.flowTxn = flow.txn;
      row.companyFee = cover.on ? Number(cover.fee) || 0 : 0;
      row.fxLoss = fxRes.on ? Number(fxRes.fx) || 0 : 0;
      if (credit) {
        row.accountCcy = credit.dst;
        row.creditRate = credit.rate;
        row.accountCreditAmt = credit.amt;
        row.creditAuto = credit.auto;
      }
      row.matchAt = stamp(0);
      row.matcher = CURRENT_USER[0];
      row.matcherMail = CURRENT_USER[1];

        remark = remark + (remark ? "；" : "") + "手续费补足 " + moneyLabel(flow.currency, row.companyFee);
      }
      if (row.fxLoss > 0) {

      }
      row.matchRemark = remark;

      row.auditAt = "";
      row.auditor = "";
      row.auditorMail = "";
      row.auditRemark = "";
      lockFlow(flow.txn, {
        by: "match",
        merchantId: row.merchantId,
        merchantName: row.merchantName,
        accountCcy: row.accountCcy || flow.currency,

    let toastTimer = 0;
    function showToast(message, opts) {
      const el = document.getElementById("toast");
      const warn = !!(opts && opts.warn);
      const center = warn || !!(opts && opts.center);
      const ms = opts && opts.ms ? opts.ms : warn ? 4000 : 2200;
      const tip = document.getElementById("hover-tip");
      if (tip) tip.hidden = true;
      el.className = "show" + (center ? " center" : "");
      el.innerHTML = '<span class="toast-dot' + (warn ? " warn" : "") + '"></span><span>' + esc(message) + "</span>";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = ""; }, ms);
    }

    function pickFlow(id) {
      const flow = state.flows.find((item) => item.id === id);
      if (flow && isFlowOccupied(flow)) {
        showToast("该流水已入账，不能再匹配");
        return;
      }
      state.dialog.selectedId = state.dialog.selectedId === id ? "" : id;
      document.querySelectorAll("[data-flow]").forEach((el) => {
        const on = el.dataset.flow === state.dialog.selectedId;
        el.checked = on;
        el.closest("tr").classList.toggle("picked", on);
      });
      const error = document.getElementById("flow-error");
      if (error && state.dialog.selectedId) error.remove();
    }

    function onAction(act, button) {
      if (act === "search") return applyList();
      if (act === "reset") return resetList();
      if (act === "create") return openCreate();
      if (act === "create-ok") return submitCreate();
      if (act === "toggle-split" && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        const body = document.querySelector(".dialog.create .dialog-bd");
        const top = body ? body.scrollTop : 0;
        state.dialog.form.split = !state.dialog.form.split;
        renderOverlay();
        const next = document.querySelector(".dialog.create .dialog-bd");
        if (next) next.scrollTop = top;
        return;

      if (act === "remove-file" && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        if (button.dataset.kind === "voucher") state.dialog.form.voucher = null;
        else state.dialog.form.files.splice(Number(button.dataset.index), 1);
        rerenderCreate();
        return;

      if (act === "batch-precharge") return openBatchPrecharge();
      if (act === "batch-precharge-ok") return submitBatchPrecharge();

        fillAllBatchAmounts();
        return;
      }
      if (act === "batch-undo-fill" && state.dialog && state.dialog.kind === "batch-precharge") {
        undoFillAllBatchAmounts();
        return;
      }

        askBatchRemove(button.dataset.id);
        return;
      }
      if (act === "batch-remove-back" && state.dialog && state.dialog.kind === "batch-precharge") {
        closeBatchRemoveConfirm();
        return;
      }
      if (act === "batch-remove-ok" && state.dialog && state.dialog.kind === "batch-precharge") {
        confirmBatchRemove();
        return;
      }
      if (act === "export") return showToast("演示页不导出敏感字段");
      if (act === "palette") return showToast("演示页未开放全局搜索");
      if (act === "bell") return showToast("没有新通知");
      if (act === "theme") return showToast("演示页保持浅色");
      if (act === "account") return showToast("当前操作人：" + CURRENT_USER[0] + "（" + CURRENT_ROLE + "）");
      if (act === "pick") {
        const input = document.getElementById(button.dataset.which);
        if (input && typeof input.showPicker === "function") {

      const row = state.rows.find((item) => item.id === button.dataset.id);

      if (act === "precharge-ok") return submitPrecharge();
      if (act === "guide-toggle" && isPrechargeDialog()) return setGuide(!state.dialog.guideOpen);
      if (act === "guide-open" && isPrechargeDialog()) return setGuide(true);
      if (act === "legend" && (isPrechargeDialog() || (state.dialog && state.dialog.kind === "lark-approval"))) return openLegend(button.dataset.kind);
      if (act === "close-legend") return closeLegend();
      if (act === "group-pick" && isPrechargeDialog()) {
        state.dialog.group = button.dataset.name;
        state.dialog.groupQuery = button.dataset.name;
        state.dialog.groupOpen = false;
        const input = document.getElementById("precharge-group");

          input.value = button.dataset.name;

      if (act === "close-drawer") return closeDrawer();

      if (act === "match" && row) return openMatch(row);
      if (act === "match-next") return goMatchNext();
      if (act === "match-prev") return goMatchPrev();
      if (act === "match-ok") return openMatchOkConfirm();
      if (act === "match-ok-confirm") return submitDialog();
      if (act === "close-match-ok") return closeMatchOkConfirm();
      if (act === "edit-ccy" && state.dialog && state.dialog.kind === "match") {
        showToast("转账币种只读。币种不一致时请返回上一步换流水");

      if (act === "edit-expect" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        return openMatchExpectDialog();
      }
      if (act === "cover-sw" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        state.dialog.coverOn = state.dialog.coverOn === false;
        renderOverlay();
        return;
      }
      if (act === "fx-sw" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        state.dialog.fxOn = state.dialog.fxOn === false;
        renderOverlay();
        return;
      }
      if (act === "edit-credit" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        return openMatchCreditDialog();
      }
      if (act === "credit-reset" && state.dialog && state.dialog.kind === "match") {
        state.dialog.creditDirty = false;
        state.dialog.creditAmt = "";
        state.dialog.fxOn = true;
        renderOverlay();
        return;
      }
      if (act === "close-credit") return closeMatchCreditDialog();
      if (act === "credit-ok") return submitMatchCredit();
      if (act === "close-expect") return closeMatchExpectDialog();
      if (act === "expect-ok") return submitMatchExpect();
      if (act === "reject" && row && row.status === "已匹配" && isFinance()) return openInvalidate(row);
      if (act === "void-ok") return submitVoid();
      if (act === "revoke" && row) return openRevoke(row);
      if (act === "revoke-ask") return askRevokeConfirm();
      if (act === "revoke-back" && state.dialog && state.dialog.kind === "revoke") {
        state.dialog.confirm = false;
        renderOverlay();
        return;
      }
      if (act === "revoke-ok") return submitRevoke();
      if (act === "close") return closeDialog();
      if (act === "flow-search") return applyFlowFilter();
      if (act === "ok") return submitDialog();
      if (act === "shot" && row) return openShots(row);
      if (act === "shot-preview" && state.dialog && state.dialog.kind === "shots") {
        const files = rowShots(currentRow());
        state.shotName = "";
        state.dialog.previewName = files[Number(button.dataset.index)] || "";
        return openPdf();
      }
      if (act === "precharge-other-remove" && isPrechargeDialog()) {
        if (state.dialog.kind === "batch-precharge") {
          syncBatchPrecharge();
          const item = button.dataset.id && state.dialog.items[button.dataset.id];
          if (item && Array.isArray(item.others)) item.others.splice(Number(button.dataset.index), 1);
        } else {
          syncPrecharge();
          (state.dialog.others || []).splice(Number(button.dataset.index), 1);
        }
        return rerenderPrecharge();
      }
      if (act === "preview-file") {
        state.shotName = "";
        if (state.dialog && state.dialog.kind === "batch-precharge") {
          const item = (button.dataset.id && state.dialog.items[button.dataset.id]) || {};
          if (button.dataset.kind === "other") {
            const files = item.others || [];
            state.dialog.previewName = files[Number(button.dataset.index)] || "";
          } else {
            state.dialog.previewName = item.voucher || "";
          }
          return openPdf();
        }
        const current = currentRow();
        if (state.dialog && (state.dialog.kind === "precharge" || state.dialog.kind === "match")) {
          if (button.dataset.kind === "other") {
            const files = state.dialog.kind === "precharge" ? (state.dialog.others || []) : rowOthers(current);
            state.dialog.previewName = files[Number(button.dataset.index)] || "";
          } else {
            if (state.dialog.kind === "precharge") {
              state.dialog.viewed = true;
              state.dialog.previewName = state.dialog.voucher || (current ? current.voucher : "");
            } else state.dialog.previewName = current ? current.voucher : "";
          }
        } else if (state.dialog) state.dialog.previewName = "";
        return openPdf();
      }
      if (act === "proof-preview" && isPrechargeDialog()) {
        state.shotName = "";
        if (state.dialog.kind === "batch-precharge") {
          const item = state.dialog.items[button.dataset.id] || {};
          const file = (item.proofFiles || [])[Number(button.dataset.index)];
          state.dialog.previewName = file ? file.name : "";
        } else {
          const file = (state.dialog.proofFiles || [])[Number(button.dataset.index)];
          state.dialog.previewName = file ? file.name : "";
        }
        return openPdf();
      }
      if (act === "proof-remove" && isPrechargeDialog()) {
        if (state.dialog.kind === "batch-precharge") {
          syncBatchPrecharge();
          const item = state.dialog.items[button.dataset.id];
          if (item && item.proofFiles) item.proofFiles.splice(Number(button.dataset.index), 1);
        } else {
          syncPrecharge();
          state.dialog.proofFiles.splice(Number(button.dataset.index), 1);
        }
        rerenderPrecharge();
        return;
      }
      if (act === "match-add" && state.dialog && state.dialog.kind === "match") {
        const input = document.getElementById("match-files");
        if (input) input.click();
        return;
      }
      if (act === "match-preview" && state.dialog && state.dialog.kind === "match") {
        state.shotName = "";
        const file = state.dialog.extraFiles[Number(button.dataset.index)];
        state.dialog.previewName = file ? file.name : "";
        return openPdf();
      }
      if (act === "match-remove" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        state.dialog.extraFiles.splice(Number(button.dataset.index), 1);
        renderOverlay();
        return;
      }
      if (act === "close-pdf") return closePdf();

    const larkMode = larkQueryMode();
    if (larkMode) showLarkPage(larkMode);
    else {
      document.getElementById("app").innerHTML = shell();
      renderRows();
    }
    const hoverTip = document.createElement("div");
    hoverTip.id = "hover-tip";
    hoverTip.hidden = true;
    document.body.appendChild(hoverTip);

    function placeHoverTip(host) {
      hoverTip.textContent = host.getAttribute("data-tip") || "";
      hoverTip.hidden = false;
      const rect = host.getBoundingClientRect();
      const tipRect = hoverTip.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - tipRect.width / 2;
      let top = rect.bottom + 8;
      if (left + tipRect.width > window.innerWidth - 8) left = window.innerWidth - tipRect.width - 8;
      if (left < 8) left = 8;
      if (top + tipRect.height > window.innerHeight - 8) top = Math.max(8, rect.top - tipRect.height - 8);
      hoverTip.style.left = left + "px";
      hoverTip.style.top = top + "px";
    }

    document.addEventListener("mouseover", (event) => {
      const host = event.target.closest("[data-tip]");
      if (!host) return;
      placeHoverTip(host);
    });
    document.addEventListener("mouseout", (event) => {
      const host = event.target.closest("[data-tip]");
      if (!host || host.contains(event.relatedTarget)) return;
      hoverTip.hidden = true;
    });
    document.addEventListener("scroll", () => { hoverTip.hidden = true; }, true);

    document.addEventListener("click", (event) => {
      if (event.target.id === "legend-mask") return closeLegend();
      if (event.target.id === "pdf-mask") return closePdf();
      if (event.target.id === "drawer-mask") return closeDrawer();
      if (event.target.id === "revoke-confirm-mask" && state.dialog) {
        state.dialog.confirm = false;
        renderOverlay();
        return;
      }
      if (event.target.id === "batch-remove-mask") return closeBatchRemoveConfirm();
      if (event.target.id === "expect-mask") return closeMatchExpectDialog();
      if (event.target.id === "credit-mask") return closeMatchCreditDialog();
      if (event.target.id === "match-ok-mask") return closeMatchOkConfirm();
      if (event.target.id === "mask") {
        if (state.dialog && state.dialog.page) return;
        return closeDialog();
      }
      const flowRow = event.target.closest("tr[data-flow-row]");
      if (flowRow && event.target.tagName !== "INPUT") return pickFlow(flowRow.dataset.flowRow);
      const flowPage = event.target.closest("[data-fpage]");
      if (flowPage && !flowPage.disabled && state.dialog) {
        syncDialogFields();
        state.dialog.flowPage = Number(flowPage.dataset.fpage);
        renderOverlay();
        return;
      }
      const pageBtn = event.target.closest("[data-page]");
      if (pageBtn && !pageBtn.disabled && pageBtn.closest("#pager")) {
        state.page = Number(pageBtn.dataset.page);
        renderRows();
        return;

      if (isPrechargeDialog() && state.dialog.groupOpen && !event.target.closest(".group-search")) {
        state.dialog.groupOpen = false;
        const menu = document.getElementById("group-menu");
        if (menu) menu.hidden = true;
      }
      const button = event.target.closest("[data-act]");
      if (!button || button.disabled) return;
      onAction(button.dataset.act, button);

      if (target.id === "start" || target.id === "end") {
        state.draft[target.id] = target.value;
        setDateLabel(target.id, target.value);

      if (target.id === "page-size") {
        state.pageSize = Number(target.value);

        const ok = toggleBatchRow(target.dataset.id, target.checked);

    document.addEventListener("input", (event) => {

      }
      if (target.id === "precharge-group" && isPrechargeDialog()) {
        state.dialog.groupQuery = target.value;
        state.dialog.group = OPS_GROUPS.indexOf(target.value) >= 0 ? target.value : "";
        state.dialog.groupOpen = true;
        const menu = document.getElementById("group-menu");
        if (menu) {
          const query = target.value.trim();
          const names = OPS_GROUPS.filter((name) => !query || name.indexOf(query) >= 0);
          menu.innerHTML = names.length ? names.map((name) => '<button type="button" class="group-opt" data-act="group-pick" data-name="' + esc(name) + '">' + esc(name) + "</button>").join("") : '<div class="group-empty">无匹配业务组</div>';
          menu.hidden = false;
        }
      }
      if (target.dataset.ratio && state.dialog && state.dialog.kind === "create") {
        state.dialog.form.ratios[target.dataset.ratio] = target.value;
        const item = target.closest(".ratio-item");
        const box = target.closest(".ratio-field");
        if (box) box.classList.remove("bad");
        if (item) {
          const error = item.querySelector(".err");
          if (error) error.remove();
        }
        delete state.dialog.form.errors["ratio-" + target.dataset.ratio];
        const accounts = customerAccounts(createCustomer());
        const total = ratioTotal(accounts, state.dialog.form.ratios);
        const warn = ratioWarn(total);
        if (warn) state.dialog.form.errors.ratioSum = warn;
        else delete state.dialog.form.errors.ratioSum;
        const sumError = document.getElementById("ratio-error");
        if (sumError) {
          sumError.hidden = !warn;
          sumError.textContent = warn;
        }
        const sum = document.getElementById("ratio-sum");
        if (sum) {
          const ready = total.complete && total.sum === 100;
          sum.textContent = "合计 " + formatRatio(total.sum) + "%";
          sum.classList.toggle("ok", ready);
          sum.classList.toggle("bad", !!warn);
        }
        paintExample();
      }
      if (target.id === "create-amount" && state.dialog && state.dialog.kind === "create") {
        state.dialog.form.amount = target.value;
        paintExample();
      }
      if (target.id === "precharge-amount" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.amount = target.value;
      }
      if (target.dataset.batchAmount && state.dialog && state.dialog.kind === "batch-precharge") {
        const id = target.dataset.batchAmount;
        if (!state.dialog.items[id]) {
          const row = state.rows.find((item) => item.id === id);
          state.dialog.items[id] = emptyBatchItem(row);
        }
        state.dialog.items[id].amount = target.value;
        paintBatchSummary();
        paintBatchAmountState(target);
      }
      if (target.id === "precharge-remark" && isPrechargeDialog()) {
        if (target.value.length > 500) target.value = target.value.slice(0, 500);
        state.dialog.remark = target.value;
        const count = document.getElementById("precharge-count");
        if (count) count.textContent = target.value.length + " / 500";
      }
      if (target.id === "void-remark" && state.dialog) {
        if (target.value.length > 1000) target.value = target.value.slice(0, 1000);
        state.dialog.remark = target.value;
        const count = document.getElementById("void-count");
        if (count) count.textContent = target.value.length + " / 1000";
      }
      if (target.id === "create-note" && state.dialog && state.dialog.kind === "create") {
        if (target.value.length > 1000) target.value = target.value.slice(0, 1000);
        state.dialog.form.note = target.value;
        const count = document.getElementById("create-count");
        if (count) count.textContent = target.value.length + " / 1000";
      }
      if (target.dataset.filter) state.dialog.draft[target.dataset.filter] = target.value;
    });

    document.addEventListener("paste", (event) => {
      if (!state.dialog || !event.clipboardData || !event.clipboardData.files || !event.clipboardData.files.length) return;
      if (state.dialog.kind === "create") {
        event.preventDefault();
        const slot = event.target.closest ? event.target.closest(".upload-slot") : null;
        const target = (slot && slot.dataset.slot) || createPasteSlot;
        if (target === "extra" || (target !== "voucher" && state.dialog.form.voucher)) addCreateExtras(event.clipboardData.files);
        else addCreateVoucher(event.clipboardData.files);
      }
      if (state.dialog.kind === "precharge") {
        const inZone = event.target.closest && event.target.closest("#proof-zone");
        if (inZone || state.dialog.proofHover) {
          event.preventDefault();
          addProofFiles(event.clipboardData.files);
        }
      }
      if (state.dialog.kind === "batch-precharge") {
        const othersInput = event.target.closest && event.target.closest("[data-batch-others]");
        const voucherInput = event.target.closest && event.target.closest("[data-batch-voucher]");
        if (othersInput) {
          event.preventDefault();
          addBatchOthers(othersInput.getAttribute("data-batch-others"), event.clipboardData.files);
        } else if (voucherInput) {
          event.preventDefault();
          addBatchVoucher(voucherInput.getAttribute("data-batch-voucher"), event.clipboardData.files);
        }
      }
    });

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type === "fund-flow-lock" || data.type === "fund-flow-unlock") {
        if (state.dialog && state.dialog.kind === "match") renderOverlay();
      }
    });
    window.addEventListener("storage", (event) => {
      if (event.key !== FLOW_LOCK_KEY) return;
      if (state.dialog && state.dialog.kind === "match") renderOverlay();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (document.getElementById("match-ok-mask")) return closeMatchOkConfirm();
        if (document.getElementById("credit-mask")) return closeMatchCreditDialog();
        if (document.getElementById("expect-mask")) return closeMatchExpectDialog();
        if (document.getElementById("legend-mask")) return closeLegend();
        if (document.getElementById("pdf-mask")) return closePdf();
        if (state.dialog && state.dialog.kind === "revoke" && state.dialog.confirm) {
          state.dialog.confirm = false;
          renderOverlay();
          return;
        }
        if (state.dialog && state.dialog.kind === "batch-precharge" && state.dialog.removeId) {
          closeBatchRemoveConfirm();
          return;
        }
        if (state.drawerId) return closeDrawer();
        if (state.dialog && state.dialog.page) return;
        if (state.dialog) return closeDialog();
      }
      if (event.key === "Enter" && event.target.dataset && event.target.dataset.q) {
        event.preventDefault();
        applyList();
      }
      if (event.key === "Enter" && event.target.dataset && event.target.dataset.filter) {
        event.preventDefault();
        applyFlowFilter();
      }
    });
  </script>
</body>
</html>
