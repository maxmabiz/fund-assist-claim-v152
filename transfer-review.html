      let value = "zz";
      for (let i = 0; i < 18; i += 1) value += String(mix(index * 31 + i + 60) % 10);

      return value;

    function attachSettlement(row, index) {
      if (row.precharge !== "是") {
        row.prechargeCurrency = "";
        row.prechargeAmount = null;
      } else if (index % 8 === 0) {
        row.prechargeCurrency = "";
        row.prechargeAmount = 0;
      } else {
        row.prechargeCurrency = index % 5 === 0 ? "EUR" : "USD";
        row.prechargeAmount = Math.round((40 + (mix(index + 8) % 12000) / 100) * 100) / 100;
      }
      const matched = stillMatched(row.status);
      if (!matched) {
        row.creditCurrency = "";
        row.creditAmount = null;
        row.payPlatform = "";
        row.flowTxn = "";
        row.matchAt = "";
        row.matcher = "";
        row.matcherMail = "";
        row.matchRemark = "";
        row.auditAt = "";
        row.auditor = "";
        row.auditorMail = "";
        row.auditRemark = "";
        return;
      }
      const matcher = index % 2 === 1 ? CURRENT_USER : PEOPLE[(index % (PEOPLE.length - 1)) + 1];
      row.creditCurrency = index % 4 === 2 ? "EUR" : "USD";
      row.creditAmount = Math.round((100 + (mix(index + 15) % 9000) / 100) * 100) / 100;
      row.payPlatform = row.platform;
      row.flowTxn = flowTxn(index);
      row.matchAt = plusSeconds(row.submitAt, 40 + (mix(index) % 180));
      row.matcher = matcher[0];
      row.matcherMail = matcher[1];
      row.matchRemark = index % 9 === 0 ? "流水金额一致" : "";
      const auditor = PEOPLE[(index + 5) % PEOPLE.length];
      row.auditAt = plusSeconds(row.matchAt, 20 + (mix(index + 2) % 90));
      row.auditor = auditor[0];
      row.auditorMail = auditor[1];
      row.auditRemark = index % 8 === 0 ? "审核通过" : "";
      if (row.status === "退回审批中") {
        const applicant = PEOPLE[(index + 1) % PEOPLE.length];
        const boss = supervisorOf(applicant[1]);
        row.voidApplicant = applicant[0];
        row.voidApplicantMail = applicant[1];
        row.voidSupervisor = boss[0];
        row.voidSupervisorMail = boss[1];
        row.voidAt = plusSeconds(row.matchAt, 90);
        row.voidRemark = "客户要求退回这笔入账";
        row.supervisorAt = "";
        row.supervisorOpinion = "";
      }
    }

      if (!n) return "批量预充仅支持代发，须同一商户、同一转账币种，至少 2 条。广告请使用行内「预充」。";
      const group = batchGroupLabel(lockRow);
      if (n < 2) return "已选 1 条代发单（" + group + "）。请再勾选该商户、该转账币种的代发记录，至少 2 条才能提交。";
      return "已选 " + n + " 条代发单（" + group + "）。还可勾选该商户、该转账币种；广告不能批量预充。";
    }

    function pruneBatchSelection() {
      Object.keys(state.selected).forEach((id) => {
        const row = state.rows.find((item) => item.id === id);
        if (!row || !canBatchPrecharge(row)) delete state.selected[id];
      });
      const rows = selectedBatchRows();
      if (rows.length <= 1) return;
      const key = batchGroupKey(rows[0]);
      rows.slice(1).forEach((row) => {
        if (batchGroupKey(row) !== key) delete state.selected[row.id];
      });
    }

    function pageRows() {
      const all = listRows();
      const start = (state.page - 1) * state.pageSize;
      return all.slice(start, start + state.pageSize);
    }

    function updateBatchBar() {
      pruneBatchSelection();
      const pickedRows = selectedBatchRows();
      const n = pickedRows.length;
      const lockRow = pickedRows[0];
      const btn = document.getElementById("batch-precharge");
      const count = document.getElementById("batch-count");
      if (btn) {
        btn.disabled = n < 2;
        btn.title = n < 2
          ? (n === 1 ? "已选 1 条代发单，请再勾选同商户、同转账币种的代发记录" : "请勾选同一商户、同一转账币种的至少 2 条代发可预充单")
          : "提交已选代发单据的批量预充";
      }
      if (count) count.textContent = batchBarCopy(n, lockRow);
      document.querySelectorAll('input[data-batch="row"]').forEach((input) => {
        const row = state.rows.find((item) => item.id === input.dataset.id);
        if (!row) return;
        const select = batchRowSelectState(row);
        input.disabled = select.disabled;
        if (select.title) input.setAttribute("data-tip", select.title);
        else input.removeAttribute("data-tip");
      });
      const head = document.getElementById("batch-page");
      if (head) {
        const eligible = pageRows().filter(canBatchPrecharge);
        const selectable = lockRow
          ? eligible.filter((row) => batchGroupKey(row) === batchGroupKey(lockRow))
          : eligible;
        const picked = selectable.filter((row) => state.selected[row.id]).length;
        head.checked = selectable.length > 0 && picked === selectable.length;
        head.indeterminate = picked > 0 && picked < selectable.length;
        head.disabled = !eligible.length;
        head.setAttribute("data-tip", "全选本页同一商户、同一转账币种的代发可预充单。广告不能批量预充。");
      }
    }

    function toggleBatchRow(id, on) {
      const row = state.rows.find((item) => item.id === id);
      if (!row || !canCheckBatchBox(row)) return false;
      if (!isFulfillBiz(row)) {
        showToast(batchBizToast(row), { warn: true, ms: 4500 });
        return false;
      }
      if (!canBatchPrecharge(row)) return false;
      if (on) {
        const lockRow = selectedBatchRows().find((item) => item.id !== id);
        if (lockRow && batchGroupKey(row) !== batchGroupKey(lockRow)) {
          showToast(batchLockToast(row, lockRow), { warn: true, ms: 4500 });
          return false;
        }
        if (!state.selected[id] && selectedBatchRows().length >= BATCH_PRECHARGE_MAX) {
          showToast("单次最多选择 " + BATCH_PRECHARGE_MAX + " 条", { warn: true });
          return false;
        }
        state.selected[id] = true;
      } else {
        delete state.selected[id];
      }
      updateBatchBar();
      return true;
    }

    function largestBatchGroup(rows) {
      const groups = {};
      let best = [];
      rows.forEach((row) => {
        const key = batchGroupKey(row);
        const list = groups[key] || (groups[key] = []);
        list.push(row);
        if (list.length > best.length) best = list;
      });
      return best;
    }

    function toggleBatchPage(on) {
      const eligible = pageRows().filter(canBatchPrecharge);
      if (on) {
        const lockRow = selectedBatchRows()[0];
        const target = lockRow
          ? eligible.filter((row) => batchGroupKey(row) === batchGroupKey(lockRow))
          : largestBatchGroup(eligible);
        target.forEach((row) => toggleBatchRow(row.id, true));
        const skipped = eligible.length - target.length;
        if (skipped > 0 && target[0]) {
          showToast("已勾选本页「" + batchGroupLabel(target[0]) + "」共 " + target.length + " 条。另有 " + skipped + " 条商户或转账币种不同，不能一起批量预充，请分开提交。", { warn: true, ms: 4500 });
        }
      } else {
        eligible.forEach((row) => delete state.selected[row.id]);
        updateBatchBar();
      }
      renderRows();
    }

    function approvalNoOf(row) {
      if (row && row.approvalNo) return row.approvalNo;
      if (row && row.biz === "履约" && row.prechargeNo) return "AP" + row.submitAt.replace(/\D/g, "").slice(0, 12);
      return "";
    }

    function emptyQuery() {
      return { reviewNo: "", merchantId: "", merchantName: "", uniqueId: "", biz: "", status: "", start: "", end: "", txn: "", precharge: "", prechargeNo: "" };
    }

    function emptyFlowQuery(platform) {
      return { platform: platform, txn: "", currency: "", amount: "", payer: "", account: "", note: "" };
    }

    function listRows() {
      const query = state.applied;
      return state.rows.filter((row) => {
        if (query.reviewNo && row.reviewNo.indexOf(query.reviewNo.trim()) < 0) return false;
        if (query.merchantId && row.merchantId.indexOf(query.merchantId.trim()) < 0) return false;
        if (query.merchantName && row.merchantName.indexOf(query.merchantName.trim()) < 0) return false;
        if (query.uniqueId && row.uniqueId.toLowerCase().indexOf(query.uniqueId.trim().toLowerCase()) < 0) return false;
        if (query.biz && row.biz !== query.biz) return false;
        if (query.status && row.status !== query.status) return false;
        if (query.txn) {
          const key = query.txn.trim().toLowerCase();
          const bizHit = row.bizTxn.toLowerCase().indexOf(key) >= 0;
          const flowHit = row.flowTxn && row.flowTxn.toLowerCase().indexOf(key) >= 0;
          if (!bizHit && !flowHit) return false;
        }
        if (query.precharge && row.precharge !== query.precharge) return false;
        if (query.prechargeNo && row.prechargeNo.toLowerCase().indexOf(query.prechargeNo.trim().toLowerCase()) < 0) return false;
        const day = row.submitAt.slice(0, 10);
        if (query.start && day < query.start) return false;
        if (query.end && day > query.end) return false;
        return true;
      });
    }

    function filteredFlows() {
      const query = state.dialog.applied;
      return state.flows.filter((flow) => {
        if (query.platform && flow.platform !== query.platform) return false;
        if (query.txn && flow.txn.toLowerCase().indexOf(query.txn.trim().toLowerCase()) < 0) return false;
        if (query.currency && flow.currency !== query.currency) return false;
        if (query.amount.trim()) {
          const amount = Number(query.amount);
          if (!Number.isFinite(amount) || Math.round(flow.net * 100) !== Math.round(amount * 100)) return false;
        }
        if (query.payer && flow.payer.indexOf(query.payer.trim()) < 0) return false;
        if (query.account && flow.account.indexOf(query.account.trim()) < 0) return false;
        if (query.note && flow.note.indexOf(query.note.trim()) < 0) return false;
        return true;
      });
    }

    function pageWindow(page, pages) {
      const width = 5;
      let start = Math.max(1, page - 2);
      let end = Math.min(pages, start + width - 1);
      start = Math.max(1, end - width + 1);
      const list = [];
      for (let i = start; i <= end; i += 1) list.push(i);
      return list;
    }

    function pagerHtml(total, page, pages, pageSize, key, sizeId) {
      const item = (label, target, disabled, cls) =>
        '<button type="button" class="page-btn' + (cls ? " " + cls : "") + '" data-' + key + '="' + target + '"' + (disabled ? " disabled" : "") + ">" + label + "</button>";
      const nums = pageWindow(page, pages).map((num) => item(String(num), num, false, num === page ? "on" : "")).join("");
      const sizes = [10, 20, 50].map((size) => '<option value="' + size + '"' + (size === pageSize ? " selected" : "") + ">" + size + "条/页</option>").join("");
      return '<div class="pager-left"><span>共 ' + total + ' 条记录</span><select id="' + sizeId + '" aria-label="每页条数">' + sizes + "</select></div>" +
        '<div class="pager-pages">' +
        item("|&lt;", 1, page <= 1, "text") +
        item("&lt;&lt;", Math.max(1, page - 5), page <= 1, "text") +
        item("&lt;", Math.max(1, page - 1), page <= 1, "text") +
        nums +
        item("&gt;", Math.min(pages, page + 1), page >= pages, "text") +
        item("&gt;&gt;", Math.min(pages, page + 5), page >= pages, "text") +
        item("&gt;|", pages, page >= pages, "text") +
        "</div>";
    }

    }

      if (state.dialog.flowPage > pages) state.dialog.flowPage = pages;
      const start = (state.dialog.flowPage - 1) * state.dialog.flowPageSize;
      const slice = all.slice(start, start + state.dialog.flowPageSize);
      const body = slice.length ? slice.map((flow) => {
        const occupied = isFlowOccupied(flow);

          '<div class="pair"><span class="k">入账基数</span><span class="v" id="feeBaseAmt">' + esc(moneyLabel(flow.currency, on ? money2(flowAmt + Math.max(diff, 0)) : flowAmt)) + "</span></div></div>" +
          '<p class="note" id="feeNote">' + esc(note) + "</p>" +
          '<p class="fee-err" id="feeErr" hidden></p></div>'
        : "";
      return feeHtml + matchCreditHtml(row, flow, dialog, { n: showFee ? "2" : "" });
    }
    function matchHtml() {
      const row = currentRow();
      const dialog = state.dialog;
      let flow = selectedFlow();
      if (flow && isFlowOccupied(flow) && row.flowId !== flow.id) {
        dialog.selectedId = "";
        flow = null;
      }
      if ((dialog.step || 1) > 1 && !flow) dialog.step = 1;
      const step = dialog.step || 1;
      let body = "";
      if (step === 1) body = matchStepFlowHtml(row, dialog);
      else if (step === 2) body = matchStepConfirmHtml(row, flow, dialog);
      else body = matchStepCoverHtml(row, flow, dialog);
      return '<div class="mask" id="mask"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="match-title">' +
        '<div class="dialog-hd"><h2 id="match-title">匹配转账信息</h2><button type="button" class="icon-btn" data-act="close" aria-label="关闭">' + ICONS.close + "</button></div>" +
        matchStickyHtml(row, dialog) +
        '<div class="dialog-bd">' + body + "</div>" +
        '<div class="dialog-ft">' + matchFooterHtml(row, flow, dialog) + "</div></div></div>";
    }

    function pdfHtml() {
      const row = state.dialog ? currentRow() : null;
      const name = state.shotName || (state.dialog && state.dialog.previewName) || (row && row.voucher) || "";

        '<div class="dialog-hd"><h2>附件预览</h2><button type="button" class="icon-btn" data-act="close-pdf" aria-label="关闭">' + ICONS.close + "</button></div>" +

        '<div class="dialog-ft"><button type="button" class="btn default" data-act="close-pdf">关闭</button></div></div></div>';

    function renderRows() {
      const all = listRows();
      const pages = Math.max(1, Math.ceil(all.length / state.pageSize));
      if (state.page > pages) state.page = pages;
      const start = (state.page - 1) * state.pageSize;
      const slice = all.slice(start, start + state.pageSize);
      document.getElementById("rows").innerHTML = slice.length ? slice.map(rowHtml).join("") : '<tr><td class="empty" colspan="31">没有符合条件的记录</td></tr>';
      document.getElementById("pager").innerHTML = pagerHtml(all.length, state.page, pages, state.pageSize, "page", "page-size");
      updateBatchBar();
    }

    function moneyLabel(currency, value) {
      const parts = Number(value).toFixed(2).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return currency + " " + parts.join(".");
    }

    function plusSeconds(value, seconds) {
      const parts = value.split(" ");
      const clock = parts[1].split(":").map(Number);
      const total = clock[0] * 3600 + clock[1] * 60 + clock[2] + seconds;
      return parts[0] + " " + pad(Math.floor(total / 3600) % 24) + ":" + pad(Math.floor(total / 60) % 60) + ":" + pad(total % 60);
    }

    function drawerFigures(row) {
      const index = Number(row.id.slice(2)) - 1;
      const transfer = row.amount == null ? AMOUNTS[index % AMOUNTS.length] : row.amount;
      let pre = Math.round(Math.max(transfer * 0.08, 0.5) * 100) / 100;
      let total = Math.round((1200 + (mix(index + 90) % 9000) + (mix(index + 91) % 100) / 100) * 100) / 100;
      let unpaid = Math.round(total * (30 + (mix(index + 92) % 40)) / 100 * 100) / 100;
      if (unpaid >= total) unpaid = Math.round(total * 0.4 * 100) / 100;
      return { transfer: transfer, pre: pre, total: total, unpaid: unpaid };
    }

    function drawerHtml(row) {
      const figures = drawerFigures(row);
      const fulfill = row.biz === "履约";
      const approvalNo = approvalNoOf(row) || row.submitAt.replace(/\D/g, "").slice(0, 12);
      const later = plusSeconds(row.submitAt, 2);
      const preAmount = row.prechargeAmount == null ? figures.pre : row.prechargeAmount;
      const preCurrency = row.prechargeCurrency || row.currency;
      const detailFile = (name) => {
        const image = !/\.pdf$/i.test(name);
        return '<div class="file-row"><i class="kind ' + (image ? "img" : "pdf") + '">' + (image ? "图片" : "PDF") + '</i><span class="file-name" title="' + esc(name) + '">' + esc(name) + '</span><button type="button" class="link" data-act="drawer-file" data-name="' + esc(name) + '">查看</button></div>';
      };
      const fileList = (names) => names.length ? '<div class="file-rows">' + names.map(detailFile).join("") + "</div>" : "-";
      const others = rowOthers(row);
      const proofs = row.proofFiles || [];
      const apply = fulfill
        ? '<section class="block"><h3>预充申请信息</h3><div class="detail-grid">' +
          '<div class="pair"><span>运营部业务组</span>' + esc(row.opsGroup || "-") + "</div><div></div>" +
          '<div class="pair span2"><span>预充证明资料</span>' + fileList(proofs) + "</div></div></section>"
        : "";
      const approval = fulfill
        ? '<div class="pair"><span>需要审批</span>是</div><div class="pair"><span>审批单号</span>' + esc(approvalNo) + "</div>" +
          '<div class="pair"><span>审批状态</span><i class="chip fill">等待审批</i></div><div class="pair"><span>预充状态</span><i class="chip fill">审批中</i></div>'
        : '<div class="pair"><span>需要审批</span>否</div><div class="pair"><span>预充状态</span><i class="chip fill">已提交</i></div>';
      const steps = '<li><i class="dot"></i><div>提交预充申请</div><div class="when">' + esc(row.submitAt) + " · " + esc(row.submitter) + "(" + esc(row.submitterMail) + ")</div></li>" +
        (fulfill ? '<li><i class="dot"></i><div>已发起飞书审批</div><div class="when">' + esc(later) + " · 等待财务处理</div></li>" : "");
      return '<div class="drawer-mask" id="drawer-mask"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="pre-title">' +
        '<div class="drawer-hd"><h2 id="pre-title">预充详情</h2><button type="button" class="icon-btn" data-act="close-drawer" aria-label="关闭">' + ICONS.close + "</button></div>" +
        '<div class="drawer-top"><div class="chips"><span class="chip">' + esc(row.biz) + '</span><span class="chip">' + (fulfill ? "等待审批" : "已提交") + '</span></div><span class="drawer-no">' + esc(row.prechargeNo) + "</span></div>" +
        '<div class="drawer-bd">' +
        '<section class="block"><h3>单据信息</h3><div class="detail-grid">' +
        '<div class="pair"><span>预充申请单号</span>' + esc(row.prechargeNo) + "</div>" +
        '<div class="pair"><span>交易ID</span>' + esc(row.bizTxn) + "</div>" +
        '<div class="pair"><span>商户ID</span>' + esc(row.merchantId) + "</div>" +
        '<div class="pair"><span>子业务</span>' + esc(row.biz) + "</div></div></section>" +
        '<section class="block"><h3>转账附件</h3><div class="attach-fields">' +
        '<div class="attach-field"><span>转账凭证</span>' + fileList(row.voucher ? [row.voucher] : []) + "</div>" +
        '<div class="attach-field"><span>其它转账附件</span>' + fileList(others) + "</div></div></section>" +
        '<section class="block"><h3>商户预充汇总</h3><div class="sum-grid">' +
        '<div class="sum-card"><span>预充金额累计</span><b>' + esc(moneyLabel(row.currency, figures.total)) + "</b></div>" +
        '<div class="sum-card"><span>预充金额未还累计</span><b class="warn">' + esc(moneyLabel(row.currency, figures.unpaid)) + "</b></div></div></section>" +
        '<section class="block"><h3>本单金额</h3><div class="detail-grid">' +
        '<div class="pair"><span>期望入账金额</span>' + esc(moneyLabel(row.currency, figures.transfer)) + "</div>" +
        '<div class="pair"><span>预充金额</span>' + esc(moneyLabel(preCurrency, preAmount)) + "</div>" +
        '<div class="pair"><span>预计到账时间</span>' + esc(row.expectedAt || "-") + "</div></div></section>" +
        apply +
        '<section class="block"><h3>审批信息</h3><div class="detail-grid">' + approval + "</div></section>" +
        '<section class="block"><h3>进度</h3><ol class="steps">' + steps + "</ol></section>" +
        '<section class="block"><h3>' + (fulfill ? "预充申请说明" : "预充备注") + "</h3><div>" + esc(row.prechargeRemark || "-") + "</div></section>" +
        "</div></aside></div>";
    }

    function renderDrawer() {
      const root = document.getElementById("drawer");
      if (!state.drawerId) {
        root.innerHTML = "";
        return;
      }
      const row = state.rows.find((item) => item.id === state.drawerId);
      root.innerHTML = row && row.prechargeNo ? drawerHtml(row) : "";
    }

    function openDrawer(row) {
      state.drawerId = row.id;
      renderDrawer();
    }

    function closeDrawer() {
      state.drawerId = null;
      renderDrawer();
    }

    function larkCcy(code) {
      const map = { USD: "美元", EUR: "欧元", GBP: "英镑", HKD: "港币", CNY: "人民币元", CNH: "人民币元" };
      if (!code) return "-";
      return map[code] ? code + "-" + map[code] : code;
    }

    function merchantMail(row) {
      if (row && row.uniqueId && String(row.uniqueId).indexOf("@") >= 0) return row.uniqueId;
      const shop = SHOPS.find((item) => item[0] === (row && row.merchantId));
      return shop ? shop[2] : "-";
    }

    function rowPrechargeAmt(row) {
      if (row && Number(row.prechargeAmount) > 0) return row.prechargeAmount;
      return rowTransferAmt(row);
    }

    function larkQuota(row) {
      const seed = Number(String(row && row.merchantId ? row.merchantId : "1").replace(/\D/g, "") || "1");
      const cap = Math.round((12000 + (mix(seed + 40) % 80000)) * 100) / 100;
      const used = Math.round(cap * (35 + mix(seed + 41) % 40) / 100 * 100) / 100;
      const ccy = (row && (row.accountCcy || MERCHANT_ACCOUNT[row.merchantId] || row.currency)) || "USD";
      return { open: "是", cap: cap, used: used, left: Math.round((cap - used) * 100) / 100, currency: ccy };
    }

    function larkHistory(row) {
      const seed = Number(String(row && row.merchantId ? row.merchantId : "1").replace(/\D/g, "") || "1");
      const total = Math.round((80000 + (mix(seed + 90) % 120000) + (mix(seed + 91) % 100) / 100) * 100) / 100;
      const unpaid = Math.round(total * (0.28 + (mix(seed + 92) % 20) / 100) * 100) / 100;
      const ccy = (row && (row.accountCcy || MERCHANT_ACCOUNT[row.merchantId] || row.currency)) || "USD";
      return { total: total, unpaid: unpaid, currency: ccy };
    }

    function approvalRowsOf(row) {
      const no = approvalNoOf(row);
      if (!row) return [];
      if (!no) return [row];
      const list = state.rows.filter((item) => item.precharge === "是" && approvalNoOf(item) === no);
      return list.length ? list : [row];
    }

    function openLarkApproval(row) {
      if (!row) return;
      state.drawerId = null;
      renderDrawer();
      const rows = approvalRowsOf(row);
      state.dialog = {
        kind: "lark-approval",
        rows: rows,
        approvalNo: approvalNoOf(row) || ""
      };
      renderOverlay();
    }

    function larkQueryMode() {
      const mode = new URLSearchParams(location.search).get("lark");
      return mode === "batch" || mode === "single" ? mode : "";
    }

    function larkDemoRows(mode) {
      if (mode === "batch") {
        return ["sc-batch-a", "sc-batch-b"].map((id, index) => {
          const row = state.rows.find((item) => item.id === id);
          if (!row) return null;
          return Object.assign({}, row, {
            precharge: "是",
            approvalNo: "AP20261121170001",
            prechargeNo: "PF202611211700" + String(index + 1).padStart(2, "0"),
            prechargeAmount: index === 0 ? 1860 : 2400,
            prechargeCurrency: row.currency,
            opsGroup: "禾风履约组",
            prechargeRemark: "客户已完成转账，申请批量预充（同一商户、同一转账币种）。"
          });
        }).filter(Boolean);
      }
      const row = state.rows.find((item) => item.biz === "履约" && item.precharge === "是" && item.prechargeNo);
      return row ? [row] : [];
    }

    function showLarkPage(mode) {
      const rows = larkDemoRows(mode);
      document.body.classList.add("lark-page");

      state.dialog = {
        kind: "lark-approval",
        rows: rows,
        approvalNo: rows[0] ? (rows[0].approvalNo || approvalNoOf(rows[0]) || "") : "",
        page: true
      };
      renderOverlay();

    function larkApprovalRows() {
      if (state.dialog && state.dialog.rows && state.dialog.rows.length) return state.dialog.rows;
      const ids = (state.dialog && state.dialog.rowIds) || [];
      return ids.map((id) => state.rows.find((item) => item.id === id)).filter(Boolean);
    }

    function larkField(label, value, required) {
      const star = required === false ? "" : '<i class="req">*</i>';
      const text = value == null || value === "" ? "-" : value;
      return '<div class="lark-row"><div class="lark-lab">' + star + esc(label) + '</div><div class="lark-val">' + (typeof text === "string" && text.indexOf("<") === 0 ? text : esc(text)) + "</div></div>";
    }

    function larkMoneyField(label, ccy, amount) {
      return '<div class="lark-row"><div class="lark-lab"><i class="req">*</i>' + esc(label) + '</div><div class="lark-money">' +
        '<div class="lark-val">' + esc(larkCcy(ccy)) + "</div>" +
        '<div class="lark-val">' + (amount == null || amount === "" ? "-" : money(amount)) + "</div></div></div>";
    }

    function larkFileChip(name, extra) {
      if (!name) return "";
      const image = !/\.pdf$/i.test(name);
      return '<span class="lark-file"><i class="kind ' + (image ? "img" : "pdf") + '">' + (image ? "图片" : "PDF") + "</i><span>" + esc(extra ? extra + " · " + name : name) + '</span><button type="button" class="link" data-act="lark-file" data-name="' + esc(name) + '">查看</button></span>';
    }

    function larkAttachList(files) {
      const chips = files.filter(Boolean).map((item) => {
        if (typeof item === "string") return larkFileChip(item);
        return larkFileChip(item.name, item.label);
      }).join("");
      return chips ? '<div class="lark-files">' + chips + "</div>" : '<div class="lark-empty">暂无附件</div>';
    }

    function larkRowFiles(row) {
      const files = [];
      if (row && row.voucher) files.push(row.voucher);
      rowOthers(row).forEach((name) => { if (name && files.indexOf(name) < 0) files.push(name); });
      (row && row.proofFiles ? row.proofFiles : []).forEach((item) => {
        const name = typeof item === "string" ? item : item && item.name;
        if (name && files.indexOf(name) < 0) files.push(name);
      });
      return files;
    }

    function larkAttachField(row) {
      return '<div class="lark-row lark-row-files"><div class="lark-lab"><i class="req">*</i>附件</div><div>' +
        larkAttachList(larkRowFiles(row)) + "</div></div>";
    }

    function larkDocFields(row) {
      return larkField("预充申请单号", row.prechargeNo || "-") +
        larkField("交易ID", row.bizTxn || "-") +
        larkMoneyField("客户转账金额", row.currency, rowTransferAmt(row)) +
        larkMoneyField("申请预充金额", row.prechargeCurrency || row.currency, rowPrechargeAmt(row)) +
        larkField("付款人", row.payer || "-") +
        larkField("提交时间", row.submitAt || "-");
    }

    function larkNoticeHtml() {
      return '<div class="lark-note"><div class="ttl">请务必请写明</div><ol>' +
        "<li>鉴于个别客户存在紧急买货/监管需求，本流程适用于代发业务客户已转账但我方未到账的在途资金。运营部/交付中心业务组根据客户已转账未到账的单笔金额申请对 Fund 系统客户钱包预充值，审批后将自动调整 Fund 系统客户钱包余额。</li>" +
        "<li>证明材料：申请 USD 500 以上须提供《平台回执》；USD 500 以下须提供《转账记录》，必须涵盖信息：付款方户名；我方收款户名；我方收款账号；转账时间；转账金额。</li>" +
        "<li>申请须以客户实际转账凭证为依据，禁止以历史转账记录或预计付款发起预充申请。</li>" +
        "<li>申请人需确保本申请中客户对我方账户已转账金额真实、准确。一旦 3 个工作日内我方账户未收到该笔充值，申请人须承担相关责任。</li>" +

      const bizBlock = '<div class="lark-sec"><div class="lark-sec-title">运营平台与业务信息</div>' +
        larkField("运营部业务组", row.opsGroup || "-") +
        larkField("商户ID", row.merchantId || "-") +

        larkField("子业务", row.biz || "-") + "</div>";
      const quotaBlock = '<div class="lark-sec"><div class="lark-sec-title">商户信用额度</div>' +
        larkField("是否开通", quota.open) +
        larkMoneyField("总额度", quota.currency, quota.cap) +
        larkMoneyField("已用额度", quota.currency, quota.used) +
        larkMoneyField("剩余额度", quota.currency, quota.left) + "</div>";
      const docs = batch
        ? rows.map((item, index) => '<div class="lark-item"><div class="lark-item-hd"><span><em>' + (index + 1) + "</em> 转账审核单号 " + esc(item.reviewNo) + "</span></div>" + larkDocFields(item) + larkAttachField(item) + "</div>").join("")
        : larkDocFields(row);
      const docsBlock = '<div class="lark-sec"><div class="lark-sec-title">转账与预充单据</div>' +
        (batch
          ? '<div class="lark-sum"><div class="lark-sum-title">本次批量预充汇总</div><div class="lark-sum-grid">' +
            '<div class="lark-sum-card"><span>总笔数</span><b>' + rows.length + " 笔</b></div>" +

            '<div class="lark-sum-card is-precharge"><span>预充合计（本次审批）</span><b>' + esc(moneyLabel(row.prechargeCurrency || row.currency, prechargeTotal)) + "</b></div>" +

      return '<div class="mask lark-mask' + (page ? " is-page" : "") + '" id="mask"><div class="lark-sheet' + (batch ? " is-batch" : "") + '" role="dialog" aria-modal="' + (page ? "false" : "true") + '" aria-labelledby="lark-title">' +
        '<div class="lark-hd"><div><h2 id="lark-title">代发预充申请</h2><div class="lark-meta">' +
        (batch ? "批量 " + rows.length + " 笔 · " : "单笔 · ") + esc(row.merchantName || "") + " · " + esc(row.currency || "") +

        (page ? "" : '<div class="lark-ft"><button type="button" class="btn default" data-act="close">关闭</button></div>') + "</div></div>";
    }

    function renderOverlay() {
      const root = document.getElementById("overlay");
      if (!state.dialog) {
        root.innerHTML = "";
        return;
      }
      if (state.dialog.kind === "shots") root.innerHTML = shotsHtml();
      else if (state.dialog.kind === "precharge") root.innerHTML = prechargeHtml();
      else if (state.dialog.kind === "batch-precharge") root.innerHTML = batchPrechargeHtml();
      else if (state.dialog.kind === "lark-approval") root.innerHTML = larkApprovalHtml();
      else if (state.dialog.kind === "invalidate") root.innerHTML = invalidateHtml();
      else if (state.dialog.kind === "revoke") root.innerHTML = revokeHtml();
      else if (state.dialog.kind === "create") root.innerHTML = createHtml();
      else root.innerHTML = matchHtml();
      bindCreateZone();
      bindProofZone();
      bindMatchWizard();
    }

    function emptyCreate() {
      return {
        biz: "", customer: "", currency: "", platform: "", txn: "", date: "",
        payer: "", transferAmt: "", amount: "", split: false, ratios: {}, note: "", voucher: null, files: [], errors: {}
      };
    }

    function openCreate() {
      state.dialog = { kind: "create", form: emptyCreate() };
      renderOverlay();
    }

    function syncCreate() {
      if (!state.dialog || state.dialog.kind !== "create") return;
      const form = state.dialog.form;
      ["txn", "date", "payer", "transferAmt", "amount", "note"].forEach((key) => {
        const el = document.getElementById("create-" + key);
        if (el) form[key] = el.value;
      });
      document.querySelectorAll("[data-ratio]").forEach((el) => {
        form.ratios[el.dataset.ratio] = el.value;
      });
    }

    function createCustomer() {
      const form = state.dialog.form;
      return CUSTOMERS.find((item) => item.id === form.customer && item.biz === form.biz);
    }

    function customerAccounts(customer) {
      if (!customer) return [];
      const order = ["履约", "广告", "拒付"];
      return CUSTOMERS.filter((item) => item.id === customer.id).sort((a, b) => order.indexOf(a.biz) - order.indexOf(b.biz));
    }

    function canSplit(customer) {
      return customerAccounts(customer).length > 1;
    }

    function parseRatio(raw) {
      const text = String(raw || "").trim();
      if (!/^\d+(\.\d{1,2})?$/.test(text)) return null;
      const value = Math.round(Number(text) * 100) / 100;
      if (value < 0 || value > 100) return null;
      return value;
    }

    function formatRatio(value) {
      return String(Math.round(value * 100) / 100);
    }

    function ratioTotal(accounts, ratios) {
      let sum = 0;
      let complete = true;
      accounts.forEach((item) => {
        const value = parseRatio(ratios[item.biz]);
        if (value == null) complete = false;
        else sum += value;
      });
      return { sum: Math.round(sum * 100) / 100, complete: complete };
    }

    function ratioWarn(total) {
      if (total.sum > 100) return "已超过 100%";
      if (total.complete && total.sum !== 100) return "总和须为 100%";
      return "";
    }

    function exampleBase(amountText, currency) {
      const raw = String(amountText || "").trim();
      const typed = /^\d+(\.\d{1,2})?$/.test(raw) && Number(raw) > 0;
      return { amount: typed ? Number(raw) : 100, sample: !typed, currency: currency || "" };
    }

    function exampleParts(accounts, ratios, amountText, currency) {
      const base = exampleBase(amountText, currency);
      const unit = base.currency ? " " + base.currency : "";
      const title = (base.sample ? "按期望入账 " : "按期望入账金额 ") + money(base.amount) + unit + (base.sample ? " 举例" : " 计算");
      const lines = accounts.map((item) => {
        const ratio = parseRatio(ratios[item.biz]);
        if (ratio == null) return "<span><b>" + esc(item.biz) + "</b> —</span>";
        const share = Math.round(base.amount * ratio) / 100;
        return "<span><b>" + esc(item.biz) + "</b> " + esc(formatRatio(ratio) + "%") + " → " + esc(money(share) + unit) + "</span>";
      }).join("");
      return { title: title, lines: lines };
    }

    function paintExample() {
      const title = document.getElementById("ratio-sample-title");
      const list = document.getElementById("ratio-sample-list");
      if (!title || !list || !state.dialog || state.dialog.kind !== "create") return;
      const form = state.dialog.form;
      const amountInput = document.getElementById("create-amount");
      const currencyInput = document.getElementById("create-currency");
      if (amountInput) form.amount = amountInput.value;
      if (currencyInput) form.currency = currencyInput.value;
      const parts = exampleParts(customerAccounts(createCustomer()), form.ratios, form.amount, form.currency);
      title.textContent = parts.title;
      list.innerHTML = parts.lines;
    }

    function rerenderCreate() {
      const body = document.querySelector(".dialog.create .dialog-bd");
      const top = body ? body.scrollTop : 0;
      renderOverlay();
      const next = document.querySelector(".dialog.create .dialog-bd");
      if (next) next.scrollTop = top;
    }

    function readUploadFile(file) {
      const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
      const image = file.type.indexOf("image/") === 0;
      if (!pdf && !image) {
        showToast("仅支持图片或 PDF");
        return null;
      }
      if (file.size > 20 * 1024 * 1024) {
        showToast("单个文件不能超过 20M");
        return null;
      }
      return { name: file.name, size: file.size };
    }

    function addCreateVoucher(list) {
      if (!state.dialog || state.dialog.kind !== "create") return;
      syncCreate();
      const form = state.dialog.form;
      let picked = null;
      let extra = 0;
      Array.from(list || []).forEach((file) => {
        const item = readUploadFile(file);
        if (!item) return;
        if (picked) extra += 1;
        else picked = item;
      });
      if (!picked) return;
      const replaced = !!form.voucher;
      form.voucher = picked;
      if (form.errors.voucher) delete form.errors.voucher;
      if (extra) showToast("转账凭证只能上传 1 个");
      else if (replaced) showToast("已替换转账凭证");
      rerenderCreate();
    }

    function addCreateExtras(list) {
      if (!state.dialog || state.dialog.kind !== "create") return;
      syncCreate();
      const form = state.dialog.form;
      const next = form.files.slice();
      Array.from(list || []).forEach((file) => {
        const item = readUploadFile(file);
        if (!item) return;
        if (next.length >= 3) {
          showToast("其它转账附件最多 3 个");
          return;
        }
        next.push(item);
      });
      form.files = next;
      rerenderCreate();
    }

    let createPasteSlot = "";

    function bindCreateZone() {
      document.querySelectorAll(".upload-slot").forEach((slot) => {
        const zone = slot.querySelector(".upload");
        slot.addEventListener("mouseenter", () => { createPasteSlot = slot.dataset.slot || ""; });
        slot.addEventListener("mouseleave", () => {
          if (createPasteSlot === slot.dataset.slot) createPasteSlot = "";
        });
        slot.addEventListener("dragover", (event) => {
          event.preventDefault();
          if (zone) zone.classList.add("over");
        });
        slot.addEventListener("dragleave", (event) => {
          if (slot.contains(event.relatedTarget)) return;
          if (zone) zone.classList.remove("over");
        });
        slot.addEventListener("drop", (event) => {
          event.preventDefault();
          if (zone) zone.classList.remove("over");
          if (!event.dataTransfer) return;
          if (slot.dataset.slot === "voucher") addCreateVoucher(event.dataTransfer.files);
          else addCreateExtras(event.dataTransfer.files);
        });
      });
    }

    function takeUploadFiles(list) {
      const incoming = [];
      Array.from(list || []).forEach((file) => {
        const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
        const image = file.type.indexOf("image/") === 0;
        if (!pdf && !image) {
          showToast("仅支持图片或 PDF");
          return;
        }
        if (file.size > 20 * 1024 * 1024) {
          showToast("单个文件不能超过 20M");
          return;
        }
        incoming.push({ name: file.name, size: file.size });
      });
      return incoming;
    }

    function addMatchFiles(list) {
      if (!state.dialog || state.dialog.kind !== "match") return;
      syncDialogFields();
      const next = state.dialog.extraFiles.slice();
      takeUploadFiles(list).forEach((file) => {
        if (next.length >= 10) {
          showToast("最多上传 10 个文件");
          return;
        }
        next.push(file);
      });
      state.dialog.extraFiles = next;
      renderOverlay();
    }

    function voucherExists(name) {
      const key = String(name || "").trim().toLowerCase();
      if (!key) return false;
      return state.rows.some((row) => {
        if (row.status === "已撤销" || row.status === "退回并作废") return false;
        return String(row.voucher || "").trim().toLowerCase() === key;
      });
    }

    function validateCreate() {
      syncCreate();
      const form = state.dialog.form;
      const errors = {};
      const customer = createCustomer();
      if (!form.biz) errors.biz = "请选择子业务";
      if (!form.customer) errors.customer = "请输入客户";
      if (!form.currency) errors.currency = "请选择转账币种";
      if (!form.platform) errors.platform = "请选择支付平台";
      if (!form.txn.trim()) errors.txn = "请输入转账交易ID";
      const transferText = String(form.transferAmt || "").trim();
      const transferNum = Number(transferText);
      if (!transferText || !Number.isFinite(transferNum) || transferNum <= 0) errors.transferAmt = "请输入转账金额";
      const amountText = form.amount.trim();
      const amountNum = Number(amountText);
      if (!amountText || !Number.isFinite(amountNum) || amountNum <= 0) errors.amount = "请输入期望入账金额";
      else if (!errors.transferAmt && form.currency && customer && accountCcyOf(customer.id) === form.currency && amountNum > transferNum) {
        errors.amount = "期望入账金额应小于或等于转账金额";
      }
      const accounts = customerAccounts(createCustomer());
      if (form.split && accounts.length > 1) {
        accounts.forEach((item) => {
          if (parseRatio(form.ratios[item.biz]) == null) errors["ratio-" + item.biz] = "请输入" + item.biz + "分配比例";
        });
        const warn = ratioWarn(ratioTotal(accounts, form.ratios));
        if (warn) errors.ratioSum = warn;
      }
      if (!form.voucher) errors.voucher = "请上传转账凭证";
      else if (voucherExists(form.voucher.name)) errors.voucher = "该转账凭证已存在，请勿重复提交";
      form.errors = errors;
      return !Object.keys(errors).length;
    }

    function submitCreate() {
      if (!validateCreate()) {
        renderOverlay();
        const failed = state.dialog && state.dialog.form.errors;
        const slot = failed && failed.transferAmt
          ? document.getElementById("create-transferAmt")
          : failed && failed.amount
            ? document.getElementById("create-amount")
            : document.querySelector('[data-slot="voucher"]');
        if (failed && (failed.transferAmt || failed.amount || failed.voucher) && slot) slot.scrollIntoView({ block: "nearest" });
        return;
      }
      const form = state.dialog.form;
      const customer = createCustomer();
      const accounts = customerAccounts(customer);
      const amount = form.amount.trim() === "" ? null : Number(form.amount);
      const transferNum = Number(String(form.transferAmt || "").trim());
      const assign = form.split && accounts.length > 1
        ? accounts.map((item) => item.biz + " " + formatRatio(parseRatio(form.ratios[item.biz])) + "%").join(" / ")
        : "-";
      const index = 200 + state.rows.length;
      const when = stamp(0);
      state.rows.unshift({
        id: "new" + index,
        reviewNo: reviewNo(index),
        merchantId: customer.id,
        merchantName: customer.name,
        merchantUuid: uuid(9000 + index),
        uniqueId: customer.mail,
        biz: form.biz,
        submitAt: when,
        submitter: "林知衡",
        submitterMail: "lin.zhiheng@harbor-demo.test",
        platform: form.platform,
        bizTxn: form.txn.trim(),
        transferDate: form.date || "-",
        payer: form.payer.trim() || "-",
        currency: form.currency,
        transferAmt: transferNum,
        accountCcy: accountCcyOf(customer.id),
        amount: amount,
        voucher: form.voucher.name,
        others: form.files.map((file) => file.name),
        shots: [form.voucher.name].concat(form.files.map((file) => file.name)),
        assign: assign,
        confirmStatus: "已确认",
        status: "待匹配",
        allocated: form.split && accounts.length > 1,
        internalNote: form.note.trim(),
        precharge: "否",
        prechargeNo: "",
        flowId: ""
      });
      attachSettlement(state.rows[0], index);
      state.page = 1;
      showToast("已提交线下转账（演示）");
      closeDialog();
      renderRows();
    }

    function splitHtml(customer) {
      if (!canSplit(customer)) return "";
      const form = state.dialog.form;
      const accounts = customerAccounts(customer);
      const total = ratioTotal(accounts, form.ratios);
      const warn = ratioWarn(total);
      const sumClass = total.complete && total.sum === 100 ? " ok" : (warn ? " bad" : "");
      const sumText = "合计 " + formatRatio(total.sum) + "%";
      const lines = form.split ? accounts.map((item) => {
        const key = "ratio-" + item.biz;
        const value = form.ratios[item.biz] || "";
        return '<div class="ratio-item"><b>' + esc(item.biz) + '</b><div class="ratio-field' + (form.errors[key] ? " bad" : "") + '"><input data-ratio="' + esc(item.biz) + '" inputmode="decimal" placeholder="请输入比例" aria-label="' + esc(item.biz) + '分配比例" value="' + esc(value) + '"><span>%</span></div>' +
          (form.errors[key] ? '<p class="err">' + esc(form.errors[key]) + "</p>" : "") + "</div>";
      }).join("") : "";
      const sample = exampleParts(accounts, form.ratios, form.amount, form.currency);
      const ratios = form.split
        ? '<p class="ratio-block-note">使用按比例划拨后，无法使用预充功能。</p>' +
          '<div class="split-hd"><div class="form-label"><i class="req">*</i>分配比例</div><p class="ratio-sum' + sumClass + '" id="ratio-sum">' + esc(sumText) + "</p></div>" +
          '<div class="ratio-board" style="grid-template-columns: repeat(' + accounts.length + ', minmax(0, 1fr))">' + lines + "</div>" +
          '<p class="err" id="ratio-error"' + (warn ? "" : " hidden") + ">" + esc(warn) + "</p>" +
          '<p class="ratio-hint">匹配成功后，期望入账金额将按业务线分配比例进行分配，总和100%，</p>' +
          '<div class="ratio-sample"><p class="ratio-sample-title" id="ratio-sample-title">' + esc(sample.title) + '</p><div class="ratio-sample-list" id="ratio-sample-list">' + sample.lines + "</div></div>"
        : "";
      return '<div class="span2 split-block"><div class="switch-row"><span>开启按比例划拨</span><button type="button" class="switch' + (form.split ? " on" : "") + '" data-act="toggle-split" role="switch" aria-checked="' + (form.split ? "true" : "false") + '"><i></i></button><span>' + (form.split ? "开启" : "关闭") + "</span></div>" + ratios + "</div>";
    }

    function submitVoid() {
      const row = currentRow();
      if (!isFinance() || !row || row.status !== "已匹配") return;
      const input = document.getElementById("void-remark");
      const txn = row.flowTxn;
      row.voidRemark = input ? input.value.trim() : "";
      row.status = "退回并作废";
      row.flowId = "";
      clearSettlement(row);
      unlockFlow(txn);
      showToast("已退回并作废（演示）");
      closeDialog();
      renderRows();
    }

    function openRevoke(row) {
      state.dialog = { kind: "revoke", rowId: row.id, remark: "", error: "", confirm: false };
      renderOverlay();
    }

    function revokeHtml() {
      const dialog = state.dialog;
      const row = currentRow();
      const remark = dialog.remark || "";
      const confirm = dialog.confirm
        ? '<div class="mask sub" id="revoke-confirm-mask"><div class="dialog void" role="dialog" aria-modal="true" aria-labelledby="revoke-confirm-title">' +
          '<div class="dialog-hd"><h2 id="revoke-confirm-title">二次确认</h2><button type="button" class="icon-btn" data-act="revoke-back" aria-label="关闭">' + ICONS.close + "</button></div>" +
          '<div class="void-body"><p class="hint">确认撤销该转账审核单？撤销后状态变为已撤销。</p></div>' +
          '<div class="dialog-ft"><button type="button" class="btn default" data-act="revoke-back">取消</button><button type="button" class="btn primary" data-act="revoke-ok">确认</button></div></div></div>'
        : "";
      return '<div class="mask" id="mask"><div class="dialog revoke" role="dialog" aria-modal="true" aria-labelledby="revoke-title">' +
        '<div class="dialog-hd"><h2 id="revoke-title">撤销转账信息</h2><button type="button" class="icon-btn" data-act="close" aria-label="关闭">' + ICONS.close + "</button></div>" +
        '<div class="dialog-bd">' + customerInfo(row) +
        '<div class="revoke-remark"><div class="remark-label"><i class="req">*</i>备注</div><div class="void-box revoke-box">' +
        '<textarea id="revoke-remark" class="control' + (dialog.error ? " bad" : "") + '" maxlength="200" placeholder="请填写备注信息">' + esc(remark) + "</textarea>" +
        '<span class="void-count" id="revoke-count">' + remark.length + " / 200</span></div>" +
        (dialog.error ? '<p class="err">' + esc(dialog.error) + "</p>" : "") +
        "</div></div>" +
        '<div class="dialog-ft"><button type="button" class="btn default" data-act="close">取消</button><button type="button" class="btn primary" data-act="revoke-ask">确认撤销</button></div></div></div>' +
        confirm;
    }

    function askRevokeConfirm() {
      const input = document.getElementById("revoke-remark");
      const value = input ? input.value : "";
      state.dialog.remark = value;
      if (!value.trim()) {
        state.dialog.error = "请填写备注信息";
        state.dialog.confirm = false;
        renderOverlay();
        return;
      }
      state.dialog.error = "";
      state.dialog.confirm = true;
      renderOverlay();
    }

    function submitRevoke() {
      const row = currentRow();
      row.flowId = "";
      row.status = "已撤销";
      row.revokeRemark = (state.dialog.remark || "").trim();
      clearSettlement(row);
      showToast("已撤销（演示）");
      closeDialog();
      renderRows();
    }

    function readListDraft() {
      document.querySelectorAll("[data-q]").forEach((el) => { state.draft[el.dataset.q] = el.value; });
      state.draft.start = document.getElementById("start").value;
      state.draft.end = document.getElementById("end").value;
    }

    function setDateLabel(which, value) {
      const label = document.getElementById(which + "-label");
      label.textContent = value || (which === "start" ? "开始日期" : "结束日期");
      label.classList.toggle("placeholder", !value);
    }

    function syncDialogFields() {
      if (!state.dialog || state.dialog.kind !== "match") return;
      const remark = document.getElementById("remark");
      if (remark) state.dialog.remark = remark.value;
      document.querySelectorAll("[data-filter]").forEach((el) => { state.dialog.draft[el.dataset.filter] = el.value; });
      const ccy = document.getElementById("match-ccy");
      if (ccy) state.dialog.xferCcy = ccy.value;
      const credit = document.getElementById("fCreditAmt");
      if (credit) state.dialog.creditAmt = credit.value;
    }

    function openMatch(row) {
      const draft = emptyFlowQuery(row.platform);
      const applied = emptyFlowQuery(row.platform);
      let selectedId = "";
      if (row.sceneTxn) {
        draft.txn = row.sceneTxn;
        applied.txn = row.sceneTxn;
        const hit = state.flows.find((flow) => flow.txn === row.sceneTxn && !isFlowOccupied(flow));
        if (hit) selectedId = hit.id;
      }
      state.dialog = {
        kind: "match",
        rowId: row.id,
        step: 1,
        xferCcy: row.currency || "USD",
        expectAmt: row.amount == null ? "" : Number(row.amount).toFixed(2),
        editCcy: false,
        coverOn: true,
        draft: draft,
        applied: applied,
        flowPage: 1,
        flowPageSize: 20,
        selectedId: selectedId,
        remark: row.sceneTxn ? "场景演示匹配" : "",
        extraFiles: (row.extraFiles || []).map((file) => ({ name: file.name, size: file.size })),
        creditAmt: "",
        creditDirty: false,
        fxOn: true,
        errors: {}
      };
      renderOverlay();
    }

    function closeDialog() {
      state.dialog = null;
      renderOverlay();
    }

    function prechargeQuota(row) {
      const index = Number(row.id.slice(2)) - 1;
      const cap = Math.round((800 + (mix(index + 40) % 9000)) * 100) / 100;
      const used = Math.round(cap * (mix(index + 41) % 50) / 100 * 100) / 100;
      return { currency: row.currency || "USD", cap: cap, used: used, left: Math.round((cap - used) * 100) / 100 };
    }

    function openPrecharge(row) {
      state.dialog = {
        kind: "precharge",
        rowId: row.id,
        amount: "",
        remark: "",
        arrive: "",
        viewed: false,
        voucher: row.voucher || "",
        voucherKey: row.voucherKey || "",
        others: rowOthers(row).slice(),
        extraFiles: [],
        proofFiles: [],
        group: "",
        groupQuery: "",
        groupOpen: false,
        guideOpen: true,
        legend: "",
        errors: {}
      };
      renderOverlay();
    }

    function isPrechargeDialog() {
      return !!(state.dialog && (state.dialog.kind === "precharge" || state.dialog.kind === "batch-precharge"));
    }

    function openBatchPrecharge() {
      const rows = selectedBatchRows();
      if (rows.length < 2) return showToast("请至少选择 2 条同一商户、同一转账币种的代发可预充单", { warn: true });
      if (rows.some((row) => !isFulfillBiz(row))) return showToast("批量预充仅支持代发业务，广告请使用行内「预充」。", { warn: true, ms: 4500 });
      if (rows.length > BATCH_PRECHARGE_MAX) return showToast("单次最多选择 " + BATCH_PRECHARGE_MAX + " 条", { warn: true });
      const mixed = rows.some((row) => batchGroupKey(row) !== batchGroupKey(rows[0]));
      if (mixed) return showToast("已选记录不是同一商户、同一转账币种，不能一起批量预充，请分开提交", { warn: true, ms: 4500 });
      const items = {};
      rows.forEach((row) => {
        items[row.id] = emptyBatchItem(row);
      });
      state.dialog = {
        kind: "batch-precharge",
        rowIds: rows.map((row) => row.id),
        items: items,
        remark: "",
        arrive: "",
        group: "",
        groupQuery: "",
        groupOpen: false,
        guideOpen: true,
        legend: "",
        errors: {},
        itemErrors: {}
      };
      renderOverlay();
    }

    function batchDialogRows() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return [];
      return (state.dialog.rowIds || []).map((id) => state.rows.find((row) => row.id === id)).filter(Boolean);
    }

    function moneyOver(value, cap) {
      if (cap == null || cap === "") return false;
      const amount = Number(value);
      const limit = Number(cap);
      if (!Number.isFinite(amount) || !Number.isFinite(limit)) return false;
      return Math.round(amount * 100) > Math.round(limit * 100);
    }

    function batchOverCapMessage(row) {
      const cap = rowTransferAmt(row);
      if (cap == null) return "预充金额不可大于转账金额";
      return "预充金额不可大于本单转账金额 " + moneyLabel(row.currency || "", cap);
    }

    function liveBatchAmountError(row, raw) {
      const value = String(raw || "").trim();
      if (!value) return "";
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "";
      return moneyOver(value, rowTransferAmt(row)) ? batchOverCapMessage(row) : "";
    }

    function paintBatchAmountState(input) {
      if (!input || !state.dialog || state.dialog.kind !== "batch-precharge") return;
      const row = state.rows.find((item) => item.id === input.dataset.batchAmount);
      if (!row) return;
      const msg = liveBatchAmountError(row, input.value);
      input.setAttribute("aria-invalid", msg ? "true" : "false");
      const wrap = input.closest(".amount-input");
      if (wrap) wrap.classList.toggle("bad", !!msg);
      const field = input.closest(".batch-field");
      if (field) {
        let err = field.querySelector(".err");
        if (msg) {
          if (!err) {
            err = document.createElement("p");
            err.className = "err";
            field.appendChild(err);
          }
          err.textContent = msg;
        } else if (err) err.remove();
      }
      const card = input.closest(".batch-item");
      if (card) card.classList.toggle("bad", !!card.querySelector(".amount-input.bad, .add-line.bad, .err"));
      state.dialog.itemErrors = state.dialog.itemErrors || {};
      const local = state.dialog.itemErrors[row.id] || {};
      if (msg) local.amount = msg;
      else delete local.amount;
      if (local.amount || local.voucher || local.file) state.dialog.itemErrors[row.id] = local;
      else delete state.dialog.itemErrors[row.id];
    }

    function refreshBatchAmountErrors() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      state.dialog.itemErrors = state.dialog.itemErrors || {};
      batchDialogRows().forEach((row) => {
        const item = state.dialog.items[row.id];
        const msg = liveBatchAmountError(row, item && item.amount);
        const local = state.dialog.itemErrors[row.id] || {};
        if (msg) local.amount = msg;
        else delete local.amount;
        if (local.amount || local.voucher || local.file) state.dialog.itemErrors[row.id] = local;
        else delete state.dialog.itemErrors[row.id];
      });
    }

    function batchAmountValue(item) {
      const amount = Number(String((item && item.amount) || "").trim());
      return Number.isFinite(amount) && amount > 0 ? amount : 0;
    }

    function moneyComma(value) {
      const parts = money(value || 0).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    function batchSummary() {
      const rows = batchDialogRows();
      const totals = {};
      rows.forEach((row) => {
        const ccy = row.currency || "-";
        totals[ccy] = (totals[ccy] || 0) + batchAmountValue(batchItemOf(row));
      });
      const currencies = Object.keys(totals);
      const amount = !currencies.length
        ? "-"
        : currencies.length === 1
          ? moneyComma(totals[currencies[0]])
          : currencies.map((ccy) => moneyLabel(ccy, totals[ccy])).join("、");
      return {
        count: rows.length,
        currency: currencies.length ? currencies.join(" / ") : "-",
        amount: amount
      };
    }

    function batchSummaryHtml() {
      const summary = batchSummary();
      return '<span class="batch-summary" id="batch-summary">' +
        "<span><em>总笔数</em><b>" + summary.count + "</b></span>" +
        "<span><em>预充币种</em><b>" + esc(summary.currency) + "</b></span>" +
        "<span><em>预充总金额</em><b>" + esc(summary.amount) + "</b></span></span>";
    }

    function paintBatchSummary() {
      const el = document.getElementById("batch-summary");
      if (!el || !state.dialog || state.dialog.kind !== "batch-precharge") return;
      const summary = batchSummary();
      el.innerHTML =
        "<span><em>总笔数</em><b>" + summary.count + "</b></span>" +
        "<span><em>预充币种</em><b>" + esc(summary.currency) + "</b></span>" +
        "<span><em>预充总金额</em><b>" + esc(summary.amount) + "</b></span>";
    }

    function fillAllBatchAmounts() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      syncBatchPrecharge();
      const snapshot = {};
      batchDialogRows().forEach((row) => {
        const item = state.dialog.items[row.id] || emptyBatchItem(row);
        snapshot[row.id] = item.amount || "";
        if (row.transferAmt != null) {
          if (!state.dialog.items[row.id]) state.dialog.items[row.id] = emptyBatchItem(row);
          state.dialog.items[row.id].amount = String(row.transferAmt);
        }
      });
      state.dialog.fillSnapshot = snapshot;
      refreshBatchAmountErrors();
      rerenderPrecharge();
    }

    function undoFillAllBatchAmounts() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge" || !state.dialog.fillSnapshot) return;
      syncBatchPrecharge();
      const snapshot = state.dialog.fillSnapshot;
      batchDialogRows().forEach((row) => {
        if (!state.dialog.items[row.id]) state.dialog.items[row.id] = emptyBatchItem(row);
        state.dialog.items[row.id].amount = snapshot[row.id] || "";
      });
      delete state.dialog.fillSnapshot;
      refreshBatchAmountErrors();
      rerenderPrecharge();
    }

    function syncBatchPrecharge() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      const dialog = state.dialog;
      const remark = document.getElementById("precharge-remark");
      const arrive = document.getElementById("precharge-arrive");
      const group = document.getElementById("precharge-group");
      if (remark) dialog.remark = remark.value;
      if (arrive) dialog.arrive = arrive.value;
      if (group) {
        dialog.groupQuery = group.value;
        dialog.group = OPS_GROUPS.indexOf(group.value) >= 0 ? group.value : "";
      }
      document.querySelectorAll("[data-batch-amount]").forEach((input) => {
        const id = input.dataset.batchAmount;
        if (!dialog.items[id]) {
          const row = state.rows.find((item) => item.id === id);
          dialog.items[id] = emptyBatchItem(row);
        }
        dialog.items[id].amount = input.value;
      });
    }

    function emptyBatchItem(row) {
      return {
        amount: "",
        voucher: (row && row.voucher) || "",
        voucherKey: (row && row.voucherKey) || "",
        others: row ? rowOthers(row).slice() : []
      };
    }

    function batchItemOf(row) {
      if (!state.dialog || !state.dialog.items) return emptyBatchItem(row);
      if (!state.dialog.items[row.id]) state.dialog.items[row.id] = emptyBatchItem(row);
      const item = state.dialog.items[row.id];
      if (item.voucher === undefined) item.voucher = row.voucher || "";
      if (!Array.isArray(item.others)) item.others = rowOthers(row).slice();
      return item;
    }

    function batchItemHtml(row, index) {
      const item = batchItemOf(row);
      const errors = (state.dialog.itemErrors && state.dialog.itemErrors[row.id]) || {};
      const transfer = rowTransferAmt(row);
      const cap = transfer == null ? "" : money(transfer);
      const placeholder = cap ? "不可大于转账金额 " + cap : "请输入预充金额";
      const transferText = transfer == null ? "-" : moneyLabel(row.currency, transfer);
      const seq = index + 1;
      return '<article class="batch-item' + (errors.amount || errors.voucher ? " bad" : "") + '">' +
        '<span class="batch-index" aria-label="第 ' + seq + ' 条">' + seq + "</span>" +
        '<div class="batch-item-body">' +
        '<div class="batch-item-hd"><span class="batch-item-title"><em>转账审核单号</em><strong>' + esc(row.reviewNo) + "</strong></span>" +
        '<button type="button" class="link" data-act="batch-remove" data-id="' + row.id + '">移除</button></div>' +
        '<div class="batch-kv"><span><em>商户</em>' + esc(row.merchantName) + "（" + esc(row.merchantId) + "）</span>" +
        "<span><em>子业务</em>履约</span>" +
        "<span><em>转账币种</em>" + esc(row.currency || "-") + "</span>" +
        "<span><em>转账金额</em>" + esc(transferText) + "</span></div>" +
        '<div class="batch-fields">' +
        '<div class="batch-field batch-field-attach"><span class="batch-field-label"><i class="req">*</i>转账凭证（证明资料）</span>' +
        '<div class="voucher-merge">' + prechargeVoucherBody(item, errors.voucher, row.id) + "</div></div>" +
        '<div class="batch-field batch-field-attach"><span class="batch-field-label">其它转账附件</span>' +
        prechargeOthersBody(item, row.id) + "</div>" +
        '<div class="batch-field"><span class="batch-field-label"><i class="req">*</i>预充金额</span>' +
        '<div class="amount-input' + (errors.amount ? " bad" : "") + '"><input class="control" inputmode="decimal" data-batch-amount="' + row.id + '" placeholder="' + esc(placeholder) + '" aria-label="' + esc(row.reviewNo) + '预充金额"' + (errors.amount ? ' aria-invalid="true"' : "") + ' value="' + esc(item.amount || "") + '"><span>' + esc(row.currency || "币种") + "</span></div>" +
        (errors.amount ? '<p class="err">' + esc(errors.amount) + "</p>" : "") +
        "</div></div></div>" +
        "</article>";
    }

    function batchPrechargeHtml() {
      const dialog = state.dialog;
      const rows = batchDialogRows();
      const errors = dialog.errors || {};
      const arrive = dialog.arrive || "";
      return '<div class="mask" id="mask"><div class="dialog precharge batch" role="dialog" aria-modal="true" aria-labelledby="precharge-title">' +
        '<div class="dialog-hd"><h2 id="precharge-title">批量预充</h2><button type="button" class="icon-btn" data-act="close" aria-label="关闭">' + ICONS.close + "</button></div>" +
        '<div class="dialog-bd">' + guideHtml() +
        '<div class="notice"><i>i</i><span>代发批量预充提交后将发起 <b>一张</b> 飞书审批，生成 ' + rows.length + " 张预充申请单，审批人只需审批一次。</span></div>" +
        '<p class="batch-note">已选 ' + rows.length + " 条代发转账审核单。业务组、预计到账时间和申请说明整批共用；预充金额、转账凭证和其它附件按单填写。广告不支持批量预充。</p>" +
        '<h3 class="section-title">预充申请信息</h3>' +
        '<div class="form-label"><i class="req">*</i>运营部业务组<span class="hint-tag">可搜索</span></div>' +
        '<div class="group-search"><input id="precharge-group" class="control' + (errors.group ? " bad" : "") + '" placeholder="输入小组/部门名称搜索" aria-label="运营部业务组" value="' + esc(dialog.groupQuery || "") + '">' +
        '<span class="search-icon">' + ICONS.search + "</span>" + groupMenuHtml() + "</div>" +
        (errors.group ? '<p class="err">' + esc(errors.group) + "</p>" : "") +
        '<div class="amount-pair"><div><div class="form-label">预计到账时间</div>' +
        '<div class="control range date-field' + (errors.arrive ? " bad" : "") + '" data-act="pick" data-which="precharge-arrive"><span class="range-text' + (arrive ? "" : " placeholder") + '" id="precharge-arrive-label">' + esc(arrive || "请选择预计到账时间") + '</span><button type="button" class="cal" data-act="pick" data-which="precharge-arrive" aria-label="打开日期">' + ICONS.calendar + '</button><input class="proxy" id="precharge-arrive" type="date" min="' + tomorrowValue() + '" aria-label="预计到账时间" value="' + esc(arrive) + '"></div>' +
        (errors.arrive ? '<p class="err">' + esc(errors.arrive) + "</p>" : "") +
        "</div><div></div></div>" +
        '<div class="form-label" style="margin-top:16px"><i class="req">*</i>预充申请说明</div>' +
        '<div class="void-box precharge-note"><textarea id="precharge-remark" class="control' + (errors.remark ? " bad" : "") + '" maxlength="500" placeholder="此处填写预充申请事由" aria-label="预充申请说明">' + esc(dialog.remark || "") + "</textarea>" +
        '<span class="void-count" id="precharge-count">' + (dialog.remark || "").length + " / 500</span></div>" +
        (errors.remark ? '<p class="err">' + esc(errors.remark) + "</p>" : "") +
        '<div class="batch-detail-hd"><h3 class="section-title">预充明细</h3>' +
        (dialog.fillSnapshot
          ? '<button type="button" class="link" data-act="batch-undo-fill">撤销填入</button>'
          : '<button type="button" class="link" data-act="batch-fill-all">全部按转账金额填入</button>') +
        "</div>" +
        '<div class="batch-list">' + rows.map(batchItemHtml).join("") + "</div>" +
        "</div>" +
        '<div class="dialog-ft">' + batchSummaryHtml() +
        '<button type="button" class="btn default" data-act="close">取消</button><button type="button" class="btn primary" data-act="batch-precharge-ok">提交审批</button></div></div></div>' +
        batchRemoveConfirmHtml();
    }

    function batchRemoveConfirmHtml() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge" || !state.dialog.removeId) return "";
      const row = state.rows.find((item) => item.id === state.dialog.removeId);
      const last = batchDialogRows().length <= 1;
      const no = row ? row.reviewNo : state.dialog.removeId;
      return '<div class="mask sub" id="batch-remove-mask"><div class="dialog void" style="width:min(420px,100%)" role="dialog" aria-modal="true" aria-labelledby="batch-remove-title">' +
        '<div class="dialog-hd"><h2 id="batch-remove-title">二次确认</h2><button type="button" class="icon-btn" data-act="batch-remove-back" aria-label="关闭">' + ICONS.close + "</button></div>" +
        '<div class="void-body"><p class="hint">确认从本次批量预充中移除转账审核单 ' + esc(no) + "？" +
        (last ? "这是当前最后一条明细，移除后将关闭批量预充。" : "") + "</p></div>" +
        '<div class="dialog-ft"><button type="button" class="btn default" data-act="batch-remove-back">取消</button><button type="button" class="btn primary" data-act="batch-remove-ok">确认移除</button></div></div></div>';
    }

    function askBatchRemove(id) {
      syncBatchPrecharge();
      state.dialog.removeId = id;
      rerenderPrecharge();
    }

    function closeBatchRemoveConfirm() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      delete state.dialog.removeId;
      rerenderPrecharge();
    }

    function confirmBatchRemove() {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      const dropId = state.dialog.removeId;
      delete state.dialog.removeId;
      if (!dropId) return rerenderPrecharge();
      state.dialog.rowIds = (state.dialog.rowIds || []).filter((id) => id !== dropId);
      if (state.dialog.items) delete state.dialog.items[dropId];
      delete state.selected[dropId];
      if (!state.dialog.rowIds.length) {
        closeDialog();
        renderRows();
        return;
      }
      rerenderPrecharge();
    }

    function addBatchVoucher(rowId, list) {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      syncBatchPrecharge();
      const item = state.dialog.items[rowId];
      if (!item) return;
      let picked = null;
      let extra = 0;
      Array.from(list || []).forEach((file) => {
        const parsed = readUploadFile(file);
        if (!parsed) return;
        if (picked) extra += 1;
        else picked = parsed;
      });
      if (!picked) return;
      item.voucher = picked.name;
      item.voucherKey = fileStem(picked.name);
      if (state.dialog.itemErrors && state.dialog.itemErrors[rowId]) delete state.dialog.itemErrors[rowId].voucher;
      if (extra) showToast("转账凭证只能上传 1 个");
      rerenderPrecharge();
    }

    function addBatchOthers(rowId, list) {
      if (!state.dialog || state.dialog.kind !== "batch-precharge") return;
      syncBatchPrecharge();
      const item = state.dialog.items[rowId];
      if (!item) return;
      if (!Array.isArray(item.others)) item.others = [];
      const next = item.others.slice();
      let overflow = false;
      Array.from(list || []).forEach((file) => {
        const parsed = readUploadFile(file);
        if (!parsed) return;
        if (next.length >= 3) {
          overflow = true;
          return;
        }
        next.push(parsed.name);
      });
      item.others = next;
      if (overflow) showToast("其它转账附件最多 3 个");
      rerenderPrecharge();
    }

    function submitBatchPrecharge() {
      syncBatchPrecharge();
      const dialog = state.dialog;
      const rows = batchDialogRows();
      if (!rows.length) return showToast("请至少保留一条转账审核单");
      const remark = (dialog.remark || "").trim();
      const errors = {};
      const itemErrors = {};
      if (!dialog.group) errors.group = "请选择运营部业务组";
      if (!remark) errors.remark = "请填写预充申请事由";
      if (dialog.arrive && dialog.arrive < tomorrowValue()) errors.arrive = "预计到账时间只能选择今日之后的日期";
      rows.forEach((row) => {
        const item = dialog.items[row.id] || emptyBatchItem(row);
        const local = {};
        const amount = String(item.amount || "").trim();
        if (!amount || !/^\d+(\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) local.amount = "请输入预充金额";
        else if (moneyOver(amount, rowTransferAmt(row))) local.amount = batchOverCapMessage(row);
        if (!item.voucher) local.voucher = "请上传转账凭证";
        if (local.amount || local.voucher) itemErrors[row.id] = local;
      });
      dialog.errors = errors;
      dialog.itemErrors = itemErrors;
      if (errors.group || errors.arrive || errors.remark || Object.keys(itemErrors).length) {
        renderOverlay();
        const firstBad = document.querySelector(".batch-item.bad") || document.querySelector(".dialog.precharge .err");
        if (firstBad) firstBad.scrollIntoView({ block: "nearest" });
        return;
      }
      const approvalNo = "AP" + stamp(0).replace(/\D/g, "").slice(0, 14);
      rows.forEach((row, index) => {
        const item = dialog.items[row.id];
        row.precharge = "是";
        row.prechargeCurrency = row.currency;
        row.prechargeAmount = Number(item.amount);
        row.expectedAt = dialog.arrive;
        row.prechargeRemark = remark;
        row.opsGroup = dialog.group;
        row.voucher = item.voucher;
        if (item.voucherKey) row.voucherKey = item.voucherKey;
        row.others = (item.others || []).slice();
        row.shots = (item.voucher ? [item.voucher] : []).concat(row.others);
        row.approvalNo = approvalNo;
        row.prechargeNo = "PF" + stamp(0).replace(/\D/g, "").slice(0, 12) + String(20 + index).padStart(2, "0");
        delete state.selected[row.id];
      });
      showToast("已提交审批（" + rows.length + " 张预充申请单，审批单号 " + approvalNo + "）");
      closeDialog();
      renderRows();
    }

    function tomorrowValue() {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + 1);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    function attachFile(name, kind, index) {
      const image = !/\.pdf$/i.test(name);
      return '<div class="file-row"><i class="kind ' + (image ? "img" : "pdf") + '">' + (image ? "图片" : "PDF") + '</i><span class="file-name" title="' + esc(name) + '">' + esc(name) + '</span><button type="button" class="link" data-act="preview-file" data-kind="' + kind + '" data-index="' + index + '">查看</button></div>';

    function fileStem(name) {
      const base = String(name || "").trim().toLowerCase().split(/[/\\]/).pop();
      const dot = base.lastIndexOf(".");
      return dot > 0 ? base.slice(0, dot) : base;
    }

    function bindProofZone() {
      const zone = document.getElementById("proof-zone");
      if (!zone || !state.dialog) return;
      zone.addEventListener("mouseenter", () => { state.dialog.proofHover = true; });
      zone.addEventListener("mouseleave", () => { if (state.dialog) state.dialog.proofHover = false; });
      zone.addEventListener("dragover", (event) => {
        event.preventDefault();
        zone.classList.add("over");

        event.preventDefault();
        zone.classList.remove("over");

    function proofTaken(name, exceptId) {
      const key = String(name || "").trim().toLowerCase();
      if (!key) return false;
      return state.rows.some((row) => {
        if (row.id === exceptId) return false;
        if (row.status === "已撤销" || row.status === "退回并作废") return false;
        return (row.proofFiles || []).some((file) => String(file).trim().toLowerCase() === key);
      });
    }

    function duplicateProof(files, exceptId) {
      const seen = {};
      let found = "";
      (files || []).forEach((file) => {
        if (found) return;
        const key = String(file.name || "").trim().toLowerCase();
        if (!key) return;
        if (seen[key] || proofTaken(file.name, exceptId)) found = file.name;
        seen[key] = true;
      });
      return found;
    }

    function submitPrecharge() {
      const dialog = state.dialog;
      const row = currentRow();
      const fulfill = row.biz === "履约";
      const amountInput = document.getElementById("precharge-amount");
      const remarkInput = document.getElementById("precharge-remark");
      const arriveInput = document.getElementById("precharge-arrive");
      const groupInput = document.getElementById("precharge-group");
      dialog.amount = amountInput ? amountInput.value : "";
      dialog.remark = remarkInput ? remarkInput.value : "";
      dialog.arrive = arriveInput ? arriveInput.value : "";
      if (groupInput) {
        dialog.groupQuery = groupInput.value;
        dialog.group = OPS_GROUPS.indexOf(groupInput.value) >= 0 ? groupInput.value : "";
      }
      const amount = dialog.amount.trim();
      const remark = dialog.remark.trim();
      const errors = {};
      if (fulfill && !dialog.group) errors.group = "请选择运营部业务组";
      if (!amount || !/^\d+(\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) errors.amount = "请输入预充金额";
      else if (fulfill && rowTransferAmt(row) != null && Number(amount) > Number(rowTransferAmt(row))) errors.amount = "预充金额不可大于转账金额";
      if (!remark) errors.remark = fulfill ? "请填写预充申请事由" : "请输入备注信息";
      if (dialog.arrive && dialog.arrive < tomorrowValue()) errors.arrive = "预计到账时间只能选择今日之后的日期";
      if (fulfill) {
        if (!dialog.voucher) errors.voucher = "请上传转账凭证";
        else if (!dialog.viewed) errors.file = "请先查看预览一次转账凭证，尽量确保客户已经转账且符合预充材料要求。";

        errors.file = "请先查看预览一次文件，尽量确保客户已经转账。";

      dialog.errors = errors;

        renderOverlay();

      const index = Number(row.id.slice(2)) - 1;

    function validateDialog() {
      const dialog = state.dialog;
      const errors = {};
      const step = dialog.step || 1;
      if (step === 1 && !dialog.selectedId) errors.flow = "请选择一条收款交易";
      if (step >= 2 && !String(dialog.remark || "").trim()) errors.remark = "请填写备注信息";
      dialog.errors = errors;
      return !errors.flow && !errors.remark;

    function readMatchCover(row, flow, dialog, live) {
      const cap = merchantCoverOf(row.merchantId);
      if (dialog.coverOn === false || !cap.any) return { on: false, fee: 0 };
      const flowAmt = money2(flow.net);
      const expect = matchExpect(row, dialog);
      const feeLimit = feeCap(flowAmt);
      if (expect == null) return live ? { pending: true } : { error: "请输入期望入账金额" };
      const diff = money2(expect - flowAmt);
      if (diff <= 0) return { on: false, fee: 0 };
      if (diff > feeLimit) return { error: "超出手续费最大比例 4%", fee: diff, diff: diff };
      return { on: true, diff: diff, fee: diff };
    }

    function updateMatchCoverCalc() {
      const row = currentRow();
      const flow = selectedFlow();
      const dialog = state.dialog;
      if (!row || !flow || !dialog) return { on: false, fee: 0 };
      syncDialogFields();
      const res = readMatchCover(row, flow, dialog, true);
      const calc = document.getElementById("feeCalc");
      const err = document.getElementById("feeErr");
      if (calc) {
        calc.hidden = false;
        calc.textContent = res.on ? moneyLabel(flow.currency, res.fee) : "—";
      }
      if (err) {
        err.hidden = !res.error;
        err.textContent = res.error || "";
      }
      return res;
    }

    function submitMatchCredit() {
      const dialog = state.dialog;
      const row = currentRow();
      const flow = selectedFlow();
      const st = matchCreditState(row, flow, dialog);
      const a1 = document.getElementById("creditAmt1");
      const a2 = document.getElementById("creditAmt2");

      const n1 = parseAmt(a1 && a1.value);

      if (!st || st.auto == null || n1 < st.auto) {
        err.textContent = "最终入账金额不能低于自动换算金额 " + (st && st.auto != null ? moneyLabel(st.dst, st.auto) : "");

        dialog.step = 1;
        renderOverlay();
        return null;
      }
      if (matchCcyMismatch(row, flow, dialog)) {
        showToast("转账审核单币种与流水币种不一致，请返回上一步选择币种一致的收款流水");
        return null;
      }
      if (isFlowOccupied(flow) && row.flowId !== flow.id) {
        showToast("该流水已入账，不能再匹配");
        return null;
      }
      if (!validateDialog()) {
        renderOverlay();
        const target = document.getElementById(dialog.errors.remark ? "remark" : "flow-anchor");
        if (target) target.scrollIntoView({ block: "nearest" });
        return null;
      }
      let cover = { on: false, fee: 0, fx: 0 };
      if (matchNeedFeeStep(row, flow, dialog)) {
        cover = readMatchCover(row, flow, dialog, false);
        if (cover.error) {
          showToast(cover.error);
          return null;
        }
      }
      const fxRes = readMatchFxCover(row, flow, dialog, false);
      if (fxRes.error) {
        showToast(fxRes.error);
        return null;
      }
      return { row: row, flow: flow, dialog: dialog, cover: cover, fxRes: fxRes, credit: matchCreditState(row, flow, dialog) };
    }

    function matchBasisText(same, fee, fx, expect, flowAmt) {
      if (fx > 0) return "含汇损补足";
      if (fee > 0) return "流水 + 手续费补足";
      if (expect != null && expect < flowAmt) return "按流水全额入账";
      if (expect != null && expect > flowAmt && fee === 0) return "按流水入账（期望仅作记录）";
      return same ? "按流水原币入账" : "按自动换算入账";
    }

    function openMatchOkConfirm() {
      const preview = previewMatchSubmit();
      if (!preview) return;
      const credit = preview.credit;
      const flow = preview.flow;
      const cover = preview.cover;
      const fxRes = preview.fxRes;
      const row = preview.row;
      const dialog = preview.dialog;
      const creditCcy = credit && credit.dst ? credit.dst : flow.currency;
      const creditAmt = credit && credit.amt != null
        ? credit.amt
        : money2(flow.net + (cover.on ? Number(cover.fee) || 0 : 0));
      const fee = cover.on ? Number(cover.fee) || 0 : 0;
      const fx = fxRes.on ? Number(fxRes.fx) || 0 : 0;
      const expect = matchExpect(row, dialog);
      const flowAmt = money2(flow.net);
      const extra = expect != null && expect < flowAmt
        ? "期望入账低于流水，已按流水全额入账。"
        : (expect != null && expect > flowAmt && fee === 0 ? "期望入账仅作记录，本笔按流水入账。" : "");
      const hasCover = fee > 0 || fx > 0;
      const lead = hasCover
        ? "请确认商户入账及公司承担后提交。入账金额已含补足，请勿与公司承担加总。"
